name: pubblica
on:
  schedule:
    # minuti dispari: allo scoccare dell'ora GitHub scarta piu' giri. La puntualita' la da' `aspetta`.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: pubblica
jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 pubblica.py aspetta
      # durante l'attesa la coda puo' essere cambiata
      - run: git pull -q
      - run: python3 pubblica.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      # anche se il passo prima fallisce: un post gia' uscito va registrato, o domani esce due volte
      - if: always()
        run: |
          git diff --quiet coda.json && exit 0
          git config user.name "denkicode-bot"
          git config user.email "bot@users.noreply.github.com"
          git add coda.json
          git commit -m "coda: esiti della pubblicazione"
          git pull --rebase -q && git push
